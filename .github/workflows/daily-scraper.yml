name: Daily Market & Pre-Mover Scraper

on:
  schedule:
    # Runs every day at 15:00 UTC (11:00 AM EDT / 10:00 AM EST)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Scraper collection target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - real_estate
          - storage
      limit:
        description: 'Max leads to push to ATM Scheduler'
        required: false
        default: '1000'

jobs:
  scrape-and-sync:
    name: Run Scrapers and Sync to Scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      USAHOMELISTINGS_EMAIL: ${{ secrets.USAHOMELISTINGS_EMAIL }}
      USAHOMELISTINGS_PASSWORD: ${{ secrets.USAHOMELISTINGS_PASSWORD }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ATM_SCHEDULER_URL: ${{ secrets.ATM_SCHEDULER_URL }}
      SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Install Playwright Chromium Browser
        run: |
          playwright install --with-deps chromium

      - name: Initialize Local SQLite Database
        run: |
          python -c "from database.db_setup import get_connection, create_tables; create_tables(get_connection())"

      - name: Execute Scraper Pipeline
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          echo "Executing scraper pipeline for target: $TARGET"
          python collectors/run_all.py --target "$TARGET"

      - name: Push Storage Prices to ATM Scheduler
        if: ${{ env.ATM_SCHEDULER_URL != '' && env.SCRAPER_API_KEY != '' && (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'storage') }}
        run: |
          python collectors/sync_storage_to_scheduler.py \
            --backend-url "$ATM_SCHEDULER_URL" \
            --api-key "$SCRAPER_API_KEY"

      - name: Push Leads to ATM Scheduler
        if: ${{ env.ATM_SCHEDULER_URL != '' && env.SCRAPER_API_KEY != '' && (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'real_estate') }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '1000' }}"
          python collectors/sync_leads_to_scheduler.py \
            --backend-url "$ATM_SCHEDULER_URL" \
            --api-key "$SCRAPER_API_KEY" \
            --limit "$LIMIT"

      - name: Upload Debug Screenshots & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-artifacts
          path: |
            debug_screenshots/
            collector.log
          if-no-files-found: ignore
